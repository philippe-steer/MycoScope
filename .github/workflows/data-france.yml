name: Data – couches France (PMTiles)

# Lancement manuel : Actions → « Data – couches France » → Run workflow.
# Un job par département (BD Forêt, BD Charm-50, SoilGrids, Copernicus DEM → tuiles z12),
# puis fusion en un seul france.pmtiles publié dans la release « data-v1 ».
on:
  workflow_dispatch:
    inputs:
      depts:
        description: "Départements (ex. 35,22,29,56) ; vide = France métropolitaine"
        required: false
        default: ""
      tag:
        description: "Release de destination"
        required: false
        default: "data-v1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      depts: ${{ steps.p.outputs.depts }}
    steps:
      - id: p
        run: |
          if [ -n "${{ inputs.depts }}" ]; then
            L="${{ inputs.depts }}"
          else
            L=$(printf "%02d," $(seq 1 19) $(seq 21 95))"2A,2B"
          fi
          echo "depts=$(echo "$L" | tr -d ' ' | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read().strip().strip(",").split(",")))')" >> "$GITHUB_OUTPUT"

  dept:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        dept: ${{ fromJson(needs.plan.outputs.depts) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build ${{ matrix.dept }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pipeline
          for i in 1 2 3 4 5; do
            python -m mycoscope_pipeline.build_dept "${{ matrix.dept }}" "$RUNNER_TEMP/tiles" --work "$RUNNER_TEMP/work" && break
            echo "::warning title=Dépt ${{ matrix.dept }}::tentative $i échouée"; sleep $((90 * i))
          done
          test -d "$RUNNER_TEMP/tiles/12"
      - uses: actions/upload-artifact@v4
        with:
          name: tiles-${{ matrix.dept }}
          path: ${{ runner.temp }}/tiles
          retention-days: 5
          compression-level: 0

  merge:
    needs: dept
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: tiles-*
          path: ${{ runner.temp }}/all
      - name: Merge
        run: |
          ls "$RUNNER_TEMP/all" | tee depts.txt
          cd pipeline && python -m mycoscope_pipeline.merge "$RUNNER_TEMP"/all/* -o "$RUNNER_TEMP/france.pmtiles"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Couches MycoScope ($TAG)" \
            --notes "Couches environnementales (format v1). Sources : IGN BD Forêt V2, BRGM BD Charm-50, ISRIC SoilGrids, Copernicus DEM GLO-30."
          gh release upload "$TAG" "$RUNNER_TEMP/france.pmtiles" --clobber
          echo "Départements inclus : $(wc -l < depts.txt)" >> "$GITHUB_STEP_SUMMARY"
