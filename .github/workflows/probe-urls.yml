name: Probe data URLs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          probe() {
            code=$(curl -sL -o page.html -w "%{http_code} %{url_effective}" -A "Mozilla/5.0" -m 30 "$1")
            echo "::notice title=GET::$1 -> $code ($(wc -c < page.html) o)"
            grep -oiE 'href="[^"]*"' page.html | grep -iE "$2" | sort -u | head -60 | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::notice title=links::/'; echo
          }
          probe "https://infoterre.brgm.fr/" "geolog|telecharg|charm|harm|donn|download|carte"
          probe "https://www.brgm.fr/fr/donnees" "geolog|telecharg|charm|harm|download|carte"
          probe "https://infoterre.brgm.fr/donnees-et-services" "geolog|telecharg|charm|harm|download|carte"
          for p in $(grep -oiE 'href="[^"]*"' page.html | grep -iE "telecharg|charm" | sed 's/href="//;s/"$//' | sort -u | head -5); do
            case "$p" in http*) u="$p";; *) u="https://infoterre.brgm.fr$p";; esac
            probe "$u" "zip|charm|harm|telecharg|download"
          done
