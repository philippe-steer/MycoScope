name: Probe data URLs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -s -m 60 "https://geoservices.brgm.fr/geologie?SERVICE=WFS&REQUEST=GetCapabilities&VERSION=2.0.0" | head -c 400 | tr '\n' ' ' | sed 's/^/::notice title=brgm wfs body::/'; echo
          curl -s -m 60 "https://geoservices.brgm.fr/geologie?SERVICE=WMS&REQUEST=GetCapabilities" -o wms.xml; grep -oE '<Name>[^<]+</Name>' wms.xml | sed 's/<[^>]*>//g' | tr '\n' ' ' | cut -c1-2500 | sed 's/^/::notice title=brgm wms layers::/'; echo
          : > all.txt
          for p in $(seq 1 40); do
            curl -s -m 60 "https://data.geopf.fr/telechargement/capabilities?page=$p&limit=200" -o c.xml || break
            n=$(grep -c "<entry" c.xml); cat c.xml >> all.txt; [ "$n" -eq 0 ] && break
          done
          grep -oiE '<id>[^<]+</id>|<title>[^<]+</title>' all.txt | grep -iE "geol|charm|harm|brgm|litho" | sort -u | head -40 | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::notice title=geopf geology::/'; echo
          echo "::notice title=geopf entries::$(grep -c '<entry' all.txt)"
