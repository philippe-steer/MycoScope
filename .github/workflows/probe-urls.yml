name: Probe data URLs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for z in 10 13; do
            read X Y < <(python3 -c "import math;z=$z;lat,lon=48.17,-1.55;n=2**z;print(int((lon+180)/360*n), int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n))")
            code=$(curl -s -m 60 -o t$z.png -w "%{http_code} %{content_type}" "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=FORETS.PUBLIQUES&STYLE=FORETS%20PUBLIQUES%20ONF&TILEMATRIXSET=PM_3_16&TILEMATRIX=$z&TILEROW=$Y&TILECOL=$X&FORMAT=image/png")
            echo "::notice title=tile z$z::$code $(wc -c < t$z.png) o ; $(python3 -c "from PIL import Image;im=Image.open('t$z.png').convert('RGBA');print(sorted(im.getcolors(100000) or [],reverse=True)[:6])" 2>&1 | tail -c 400)"
          done
          for P in "48.17,-1.55" "48.40,2.70" "45.20,4.10"; do
            la=${P%,*}; lo=${P#*,}
            curl -s -m 60 "https://data.geopf.fr/wms-v/ows?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetFeatureInfo&LAYERS=FORETS.PUBLIQUES&QUERY_LAYERS=FORETS.PUBLIQUES&CRS=EPSG:4326&BBOX=$(python3 -c "print(f'{$la-0.01},{$lo-0.01},{$la+0.01},{$lo+0.01}')")&WIDTH=101&HEIGHT=101&I=50&J=50&INFO_FORMAT=application/json&FEATURE_COUNT=2" -o fi.json
            echo "::notice title=attrs $P::$(python3 -c "import json;d=json.load(open('fi.json'));print([f.get('properties') for f in d.get('features',[])])" 2>&1 | head -c 900)"
          done
