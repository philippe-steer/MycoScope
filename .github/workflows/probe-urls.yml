name: Probe data URLs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in "https://geoservices.brgm.fr/geologie?SERVICE=WFS&REQUEST=GetCapabilities&VERSION=2.0.0" \
                   "https://mapsref.brgm.fr/wxs/referentiel/geologie?SERVICE=WFS&REQUEST=GetCapabilities" \
                   "https://data.geopf.fr/telechargement/capabilities?limit=500" ; do
            code=$(curl -sL -o cap.xml -w "%{http_code}" -m 60 "$u")
            echo "::notice title=CAP::$u -> $code ($(wc -c < cap.xml) o)"
            grep -oiE '<(wfs:)?Name>[^<]+</(wfs:)?Name>' cap.xml | sed 's/<[^>]*>//g' | sort -u | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::notice title=types::/'; echo
            grep -oiE '<title>[^<]*(geol|charm|harm|BRGM)[^<]*</title>' cap.xml | sort -u | head -30 | tr '\n' ' ' | cut -c1-2000 | sed 's/^/::notice title=titles::/'; echo
          done
